name: Daily Threat Intelligence Pipeline

on:
  schedule:
    - cron: '0 19 * * *' # 平日朝9時(JST)など
  workflow_dispatch: # 手動実行用

jobs:
  run-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ← これがないと git push で失敗します
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
        - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pyyaml python-dotenv
      - name: Run collector
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          chmod +x run_and_push_sh.sh
          # ./run_and_push_sh.sh daily
          # ./run_and_push_sh.sh weekly    
          ./run_and_push_sh.sh custom 30